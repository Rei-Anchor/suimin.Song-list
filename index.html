<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102a43"><title>suimin. 歌った曲リスト</title><link rel="stylesheet" href="style.css"></head>
<body><header class="mast"><div class="wrap mast-inner"><div class="brand"><span class="brand-mark">♪</span><span>suimin.<small>歌った曲リスト</small></span></div><a class="source" href="https://docs.google.com/spreadsheets/d/127P3KxUfj_MELT37ewvMRAgp4dByKz6JLiVdMuQTwx8/edit" target="_blank" rel="noopener">元のリスト ↗</a></div></header>
<main class="wrap"><section class="intro"><div><p class="eyebrow">SONG ARCHIVE</p><h1>あの歌声に、<br>もう一度会いに。</h1><p>曲名やアーティストから、歌枠の記録を探せます。</p></div><div class="count"><strong id="songCount">—</strong><span>歌唱記録</span><small id="rangeText"></small></div></section>
<section class="search-panel" aria-label="楽曲検索"><label for="query">曲名・アーティストを検索</label><div class="search-box"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="例：サリシノハラ、みきとP" autocomplete="off"></div><div class="controls"><label>並び順<select id="sort"><option value="recent">新しい歌唱順</option><option value="old">古い歌唱順</option><option value="count">歌唱回数順</option><option value="title">曲名順</option></select></label><label>歌唱回数<select id="minCount"><option value="1">すべて</option><option value="2">2回以上</option><option value="5">5回以上</option><option value="10">10回以上</option></select></label></div></section>
<section class="highlights" aria-label="楽曲ピックアップ"><div class="highlight-box"><p class="eyebrow">MOST SUNG</p><h2>歌唱数 TOP 5</h2><ol id="topFive"></ol></div><div class="highlight-box pick"><p class="eyebrow">TODAY'S PICK</p><h2>おすすめ楽曲</h2><p class="pick-source">全楽曲からランダムで1曲</p><div id="randomSong"></div><button id="shuffle" type="button">別の曲を見る</button></div></section>
<section class="results"><div class="section-head"><div><p class="eyebrow">DISCOVER</p><h2>楽曲一覧</h2></div><span id="resultCount" aria-live="polite"></span></div><div id="list" class="grid"></div><div id="empty" class="empty" hidden>一致する曲がありません。検索語や条件を変えてみてください。</div><button id="more" class="more" hidden>もっと見る</button></section><footer><span id="dataStatus" role="status">スプレッドシートのデータを読み込み中…</span> <a href="https://docs.google.com/spreadsheets/d/127P3KxUfj_MELT37ewvMRAgp4dByKz6JLiVdMuQTwx8/edit" target="_blank" rel="noopener">元のシートを確認</a></footer></main><script src="script.js" defer></script></body></html>
